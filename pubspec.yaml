name: teamwork
description: A clean mobile group task management application.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^3.4.3
  permission_handler: ^11.3.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  socket_io_client: ^2.0.3
  go_router: ^18.1.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true